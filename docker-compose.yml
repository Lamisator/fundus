# Fundus — knowledge base stack.
#
#   cp .env.example .env    # set POSTGRES_PASSWORD (and SSO if wanted)
#   mkdir -p data pgdata backups
#   docker compose up -d --build
#
# All state lives in bind-mounted directories next to this file (no Docker
# volumes): ./pgdata (database), ./data (attachments), ./backups (dumps).

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fundus
      POSTGRES_USER: fundus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18 images keep their data below /var/lib/postgresql (the
      # image's VOLUME path), so binding exactly that path avoids an anonymous
      # volume and leaves room for pg_upgrade --link later.
      - ./pgdata:/var/lib/postgresql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundus -d fundus"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  fundus:
    build:
      context: .
      args:
        VERSION: ${FUNDUS_VERSION:-1.0.0}
    image: fundus:${FUNDUS_VERSION:-1.0.0}
    restart: unless-stopped
    # Run as the owner of ./data so the bind mount is writable.
    user: "${FUNDUS_UID:-1000}:${FUNDUS_GID:-1000}"
    env_file: .env
    environment:
      DATABASE_URL: postgres://fundus:${POSTGRES_PASSWORD}@db:5432/fundus?sslmode=disable
      FUNDUS_ADDR: ":8080"
      FUNDUS_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${FUNDUS_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
